<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAKVA Metaverse | 3D World</title>
    
    <!-- 1. Tailwind CSS για το UI Overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Firebase SDK (για μελλοντικό συγχρονισμό σκορ) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- 3. Three.js LIBRARY (Για τα 3D Γραφικά) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

    <style>
        /* Στυλ για το 3D Canvas */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Να βρίσκεται κάτω από το UI */
        }
        
        /* Στυλ για το UI Overlay */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* Να βρίσκεται πάνω από το 3D */
            pointer-events: none; /* Επιτρέπει τα κλικ στο 3D κάτω μέρος */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        /* Κάνει τα κουμπιά και το header clickable */
        .interactive {
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans overflow-hidden">

    <!-- ==== ΜΟΥΣΙΚΗ ΥΠΟΚΡΟΥΣΗ ==== -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- ==== ΤΟ 3D GAME CANVAS (Three.js) ==== -->
    <div id="game-canvas"></div>

    <!-- ==== ΤΟ UI OVERLAY (HTML/CSS) ==== -->
    <div id="ui-overlay">
        
        <!-- Header -->
        <header class="interactive p-4 flex justify-between items-center bg-gray-900/70 border-b border-gray-700 backdrop-blur-sm rounded-b-2xl shadow-lg">
            <div class="flex items-center gap-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Solana_logo.png" alt="Solana Logo" class="h-8 w-8 object-contain">
                <h1 class="text-2xl font-extrabold tracking-tight text-white">BAKVA <span class="text-yellow-400">Metaverse</span></h1>
            </div>
            <div class="flex items-center gap-3">
                
                <!-- Κουμπί Ελέγχου Ήχου (ΝΕΟ) -->
                <button id="soundToggleBtn" class="bg-gray-800 hover:bg-gray-700 p-2.5 rounded-full border border-gray-600 shadow-md transition duration-300">
                    <span id="sound-icon" class="text-lg">🔈</span>
                </button>

                <!-- Wallet Address Display (hidden until connected) -->
                <span id="wallet-display" class="text-sm text-yellow-300 font-mono hidden truncate max-w-xs"></span>
                
                <!-- Connect Wallet Button -->
                <button id="connectWalletBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-full font-bold shadow-md transition duration-300 text-lg flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    Connect Wallet
                </button>
            </div>
        </header>

        <!-- Central HUD (Hidden until movement is ready) -->
        <main class="flex-grow flex items-center justify-center">
            <div id="hud-center" class="bg-gray-900/60 p-6 rounded-3xl backdrop-blur-md border border-gray-700 text-center interactive hidden transition-all duration-500">
                <div class="text-4xl font-bold text-yellow-400 mb-2" id="token-balance">0.00 BAK</div>
                <p class="text-gray-300 text-lg mb-5">Your BAKVA Token Balance</p>
                <button class="bg-yellow-500 hover:bg-yellow-400 text-gray-950 px-8 py-3 rounded-2xl font-bold text-xl shadow-xl transition duration-300">Explore World</button>
            </div>
        </main>

        <!-- Footer Menu Grid (Interact with the 3D world) -->
        <footer class="interactive p-6 grid grid-cols-4 gap-4 bg-gray-900/70 border-t border-gray-700 rounded-t-2xl shadow-xl">
            <button class="flex flex-col items-center justify-center gap-2 text-gray-300 hover:text-yellow-400 p-3 rounded-xl bg-gray-800/50 border border-gray-700">
                <span class="text-2xl">🎒</span> Inventory
            </button>
            <button class="flex flex-col items-center justify-center gap-2 text-gray-300 hover:text-yellow-400 p-3 rounded-xl bg-gray-800/50 border border-gray-700">
                <span class="text-2xl">🗺️</span> Map
            </button>
            <button class="flex flex-col items-center justify-center gap-2 text-gray-300 hover:text-yellow-400 p-3 rounded-xl bg-gray-800/50 border border-gray-700">
                <span class="text-2xl">🛍️</span> Shop
            </button>
            <button class="flex flex-col items-center justify-center gap-2 text-emerald-300 hover:text-emerald-400 p-3 rounded-xl bg-gray-800/50 border border-emerald-700 font-semibold">
                <span class="text-2xl">💎</span> Stake
            </button>
        </footer>
    </div>

    <!-- ==== JAVASCRIPT (Three.js + Web3 Integration + Music) ==== -->
    <script>
        // --- ΚΩΝΣΤΑΝΤΙΝΕΣ & ΡΥΘΜΙΣΕΙΣ ---
        const OWNER_SOL_WALLET = "CiWjs9UYMhqwgN5CD9qKSGHK36aZPwy5ssJ1QorzxTM4";
        
        let scene, camera, renderer, cube;
        let playerAddress = null;
        let tokenMintAddress = "BAKVA... (Replace with actual Mint Address later)"; 

        // --- 1. ΑΡΧΙΚΟΠΟΙΗΣΗ ΤΟΥ 3D ΚΟΣΜΟΥ (THREE.JS) ---
        function initThree() {
            const container = document.getElementById('game-canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 6); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); 
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0xFBBF24 }); 
            cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 0.5, 0); 
            scene.add(cube);

            const gridHelper = new THREE.GridHelper(20, 20, 0x4B5563, 0x374151); 
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 2. ANIMATION LOOP (GAME LOOP) ---
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        // --- 3. ΛΟΓΙΚΗ ΜΟΥΣΙΚΗΣ (ΝΕΟ) ---
        const music = document.getElementById('bg-music');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('sound-icon');
        let isPlaying = false;

        soundToggleBtn.addEventListener('click', () => {
            if (isPlaying) {
                music.pause();
                soundIcon.innerText = '🔈';
            } else {
                music.play().catch(e => console.log("User interaction required"));
                soundIcon.innerText = '🔊';
            }
            isPlaying = !isPlaying;
        });

        // --- 4. WEB3 / PHANTOM WALLET INTEGRATION ---
        const connectBtn = document.getElementById('connectWalletBtn');
        const walletDisplay = document.getElementById('wallet-display');
        const hudCenter = document.getElementById('hud-center');

        window.addEventListener('load', async () => {
            initThree();
            animate();
            
            if ("solana" in window) {
                const provider = window.solana;
                if (provider.isPhantom) {
                    provider.connect({ onlyIfTrusted: true })
                        .then(handleConnect)
                        .catch(err => { console.log("Not auto-connected") });
                }
            }
        });

        connectBtn.addEventListener('click', async () => {
            if (!playerAddress) {
                try {
                    if ("solana" in window) {
                        const provider = window.solana;
                        if (provider.isPhantom) {
                            const response = await provider.connect();
                            handleConnect(response);
                        } else {
                            alert("Phantom Wallet not found! Please install the extension.");
                        }
                    } else {
                        alert("Solana object not found. Make sure a Phantom wallet extension is active.");
                    }
                } catch (err) {
                    console.error("Connection rejected:", err);
                    alert("Connection rejected or failed.");
                }
            } else {
                try {
                    await window.solana.disconnect();
                    playerAddress = null;
                    connectBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg> Connect Wallet';
                    connectBtn.classList.remove('bg-gray-700');
                    connectBtn.classList.add('bg-emerald-600');
                    walletDisplay.classList.add('hidden');
                    hudCenter.classList.add('hidden');
                } catch (err) {
                    console.error("Disconnect failed:", err);
                }
            }
        });

        function handleConnect(response) {
            playerAddress = response.publicKey.toString();
            const shortAddress = playerAddress.slice(0, 6) + '...' + playerAddress.slice(-4);
            
            walletDisplay.innerText = shortAddress;
            walletDisplay.classList.remove('hidden');
            connectBtn.innerText = 'Connected';
            connectBtn.classList.remove('bg-emerald-600');
            connectBtn.classList.add('bg-gray-700', 'cursor-default');
            hudCenter.classList.remove('hidden');
            
            console.log("Wallet Connected!", playerAddress);
        }
    </script>
</body>
</html>
