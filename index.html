<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAKVA Metaverse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body class="bg-gray-950 text-white overflow-hidden select-none">

    <!-- Μουσική Υπόκρουση -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- 3D Canvas -->
    <div id="game-canvas" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay -->
    <div id="ui" class="absolute inset-0 z-10 p-4 flex flex-col justify-between pointer-events-none">
        
        <!-- Header -->
        <header class="flex justify-between items-center pointer-events-auto bg-gray-900/80 p-3 rounded-2xl border border-gray-800 backdrop-blur-md">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold">BAKVA <span class="text-yellow-400">Metaverse</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <!-- Κουμπί Μουσικής -->
                <button id="soundBtn" class="bg-gray-800 hover:bg-gray-700 p-2.5 rounded-full border border-gray-700 transition">🔈</button>
                <!-- Wallet Button -->
                <button id="connectBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-full font-bold text-sm transition shadow-lg">Connect Wallet</button>
            </div>
        </header>

        <!-- Center HUD / Instructions -->
        <div class="text-center pointer-events-auto">
            <div class="inline-block bg-gray-900/60 px-4 py-2 rounded-xl border border-gray-800 backdrop-blur-sm text-yellow-300 text-sm font-mono">
                Use <span class="text-white font-bold">W, A, S, D</span> to Move
            </div>
        </div>

        <!-- Footer Menu -->
        <footer class="pointer-events-auto grid grid-cols-4 gap-2 bg-gray-900/80 p-3 rounded-2xl border border-gray-800 backdrop-blur-md">
            <button class="flex flex-col items-center justify-center p-2 rounded-xl bg-gray-800/50 hover:bg-gray-800 text-xs text-gray-300 hover:text-yellow-400 transition">
                <span class="text-lg">🎒</span> Inventory
            </button>
            <button class="flex flex-col items-center justify-center p-2 rounded-xl bg-gray-800/50 hover:bg-gray-800 text-xs text-gray-300 hover:text-yellow-400 transition">
                <span class="text-lg">🗺️</span> Map
            </button>
            <button class="flex flex-col items-center justify-center p-2 rounded-xl bg-gray-800/50 hover:bg-gray-800 text-xs text-gray-300 hover:text-yellow-400 transition">
                <span class="text-lg">🛍️</span> Shop
            </button>
            <button class="flex flex-col items-center justify-center p-2 rounded-xl bg-emerald-900/40 hover:bg-emerald-900/60 text-xs text-emerald-300 font-semibold transition border border-emerald-800/50">
                <span class="text-lg">💎</span> Stake
            </button>
        </footer>
    </div>

    <!-- Script -->
    <script>
        let scene, camera, renderer, player;
        let keys = { w: false, s: false, a: false, d: false };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 15, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-canvas').appendChild(renderer.domElement);

            // Φωτισμός
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Χαρακτήρας (Κώνος)
            player = new THREE.Mesh(
                new THREE.ConeGeometry(0.5, 1, 32),
                new THREE.MeshPhongMaterial({ color: 0xFBBF24 })
            );
            player.position.y = 0.5;
            scene.add(player);

            // Έδαφος
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshPhongMaterial({ color: 0x228B22 })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Keyboard Events
            window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
            window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Κίνηση Παίκτη
            const speed = 0.12;
            if (keys.w) player.position.z -= speed;
            if (keys.s) player.position.z += speed;
            if (keys.a) player.position.x -= speed;
            if (keys.d) player.position.x += speed;

            // Κάμερα ακολουθεί
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 8;
            camera.position.y = 4;
            camera.lookAt(player.position.x, player.position.y - 1, player.position.z);

            renderer.render(scene, camera);
        }

        // Μουσική Logic
        const music = document.getElementById('bg-music');
        const soundBtn = document.getElementById('soundBtn');
        let isPlaying = false;

        soundBtn.onclick = () => {
            if (isPlaying) {
                music.pause();
                soundBtn.innerText = '🔈';
            } else {
                music.play().catch(e => console.log("Audio play blocked"));
                soundBtn.innerText = '🔊';
            }
            isPlaying = !isPlaying;
        };

        // Wallet Logic
        document.getElementById('connectBtn').onclick = async () => {
            if (window.solana && window.solana.isPhantom) {
                try {
                    const response = await window.solana.connect();
                    const address = response.publicKey.toString();
                    document.getElementById('connectBtn').innerText = address.slice(0, 4) + '...' + address.slice(-4);
                } catch (err) {
                    console.error("Connection error");
                }
            } else {
                alert("Phantom Wallet not found!");
            }
        };

        init();
    </script>
</body>
</html>
