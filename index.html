<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAKVA Metaverse - 360 Explore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <style>
        body { margin: 0; touch-action: none; overflow: hidden; background: #000; }
        #game-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .touch-zone { position: absolute; bottom: 100px; width: 110px; height: 110px; pointer-events: auto; opacity: 0; }
    </style>
</head>
<body>

    <div id="game-canvas"></div>

    <!-- Invisible Movement Controls -->
    <div id="zoneW" class="touch-zone" style="left: 50%; transform: translateX(-50%); bottom: 180px;"></div>
    <div id="zoneA" class="touch-zone" style="left: 8%; bottom: 100px;"></div>
    <div id="zoneS" class="touch-zone" style="left: 50%; transform: translateX(-50%); bottom: 60px;"></div>
    <div id="zoneD" class="touch-zone" style="right: 8%; bottom: 100px;"></div>

    <div id="ui">
        <header class="flex justify-between items-center interactive bg-gray-900/80 p-3 rounded-2xl border border-gray-800 backdrop-blur-md shadow-lg">
            <h1 class="text-xl font-bold text-white">BAKVA <span class="text-yellow-400">Metaverse</span></h1>
            <button id="connectBtn" onclick="connectWallet()" class="bg-emerald-600 px-4 py-2 rounded-full font-bold text-sm text-white truncate max-w-[130px]">Connect Wallet</button>
        </header>

        <div id="modal" class="interactive hidden self-center bg-gray-900/95 border border-yellow-500/50 p-6 rounded-2xl shadow-2xl max-w-sm w-full">
            <h3 id="modal-title" class="text-lg font-bold text-yellow-400 mb-3">Menu</h3>
            <div id="modal-body" class="text-sm text-gray-300 mb-5 space-y-3 max-h-48 overflow-y-auto"></div>
            <button onclick="closeModalWindow()" class="bg-yellow-500 text-gray-950 font-bold px-4 py-2 rounded-xl w-full">Close</button>
        </div>

        <div></div>

        <footer class="interactive grid grid-cols-4 gap-2 bg-gray-900/80 p-3 rounded-2xl border border-gray-800 backdrop-blur-md shadow-lg">
            <button onclick="openInventory()" class="flex flex-col items-center text-xs text-gray-300 py-1 hover:text-yellow-400">🎒 <span>Inv</span></button>
            <button onclick="openMap()" class="flex flex-col items-center text-xs text-gray-300 py-1 hover:text-yellow-400">🗺️ <span>Map</span></button>
            <button onclick="openShop()" class="flex flex-col items-center text-xs text-gray-300 py-1 hover:text-yellow-400">🛍️ <span>Shop</span></button>
            <button onclick="openStake()" class="flex flex-col items-center text-xs text-emerald-300 py-1 font-semibold">💎 <span>Stake</span></button>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, player, guardian, ground;
        let keys = { w: false, s: false, a: false, d: false };
        let walletAddress = null;
        let myInventory = ["BAKVA Core Node", "Quantum Drone"];
        
        // 360 Camera Rotation variables
        let cameraAngle = 0;
        let cameraHeight = 4;
        let cameraDistance = 8;
        let isDragging = false;
        let previousTouchX = 0;

        async function connectWallet() {
            if (window.solana && window.solana.isPhantom) {
                try {
                    const resp = await window.solana.connect();
                    walletAddress = resp.publicKey.toString();
                    document.getElementById('connectBtn').innerText = walletAddress.slice(0, 4) + "..." + walletAddress.slice(-4);
                    document.getElementById('connectBtn').className = "bg-gray-700 px-4 py-2 rounded-full font-bold text-sm text-white";
                } catch (err) { console.error(err); }
            } else { alert("Please install Phantom Wallet!"); window.open("https://phantom.app/", "_blank"); }
        }

        function showModal(title, html) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModalWindow() { document.getElementById('modal').classList.add('hidden'); }

        function openInventory() {
            let html = "";
            myInventory.forEach(i => html += `<div class="bg-gray-800 p-2 rounded-xl mb-1 text-white">✨ ${i}</div>`);
            showModal("Inventory & Assets", html);
        }

        function openMap() {
            showModal("World Teleport Realm", `
                <div class="space-y-2">
                    <button onclick="switchWorld('forest')" class="w-full bg-green-900/60 p-3 rounded-xl text-left text-white font-bold">🌲 Green Forest Realm</button>
                    <button onclick="switchWorld('volcano')" class="w-full bg-red-900/60 p-3 rounded-xl text-left text-white font-bold">🌋 Volcanic Wasteland</button>
                    <button onclick="switchWorld('crystal')" class="w-full bg-purple-900/60 p-3 rounded-xl text-left text-white font-bold">💎 Crystal Sky City</button>
                </div>
            `);
        }

        function switchWorld(type) {
            if(type === 'forest') {
                scene.background.setHex(0x87CEEB);
                ground.material.color.setHex(0x228B22);
            } else if(type === 'volcano') {
                scene.background.setHex(0x2b0909);
                ground.material.color.setHex(0x3a1a1a);
            } else if(type === 'crystal') {
                scene.background.setHex(0x1a1a3a);
                ground.material.color.setHex(0x4b0082);
            }
            player.position.set(0, 0, 0);
            closeModalWindow();
        }

        function openShop() {
            showModal("BAKVA Store", `
                <div class="space-y-2">
                    <div class="flex justify-between items-center bg-gray-800 p-2 rounded-xl">
                        <span class="text-xs text-white">⚡ Energy Core</span> 
                        <button onclick="buyItem('Energy Core')" class="bg-yellow-500 text-black font-bold px-3 py-1 rounded-lg text-xs">Buy 100</button>
                    </div>
                </div>
            `);
        }

        function openStake() {
            showModal("Staking Hub", `
                <div class="text-center space-y-3">
                    <p class="text-xs text-gray-400">Earn passive yields up to 45% APY.</p>
                    <button onclick="alert('Staked successfully!')" class="w-full bg-emerald-600 py-2 rounded-xl font-bold text-white text-xs">START STAKING</button>
                </div>
            `);
        }

        function buyItem(item) { myInventory.push(item); alert("Acquired: " + item); closeModalWindow(); }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 35, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-canvas').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const sun = new THREE.DirectionalLight(0xffffff, 1.3);
            sun.position.set(20, 50, 20);
            scene.add(sun);

            // Έδαφος
            ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshPhongMaterial({ color: 0x228B22 }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Λίμνη
            const lake = new THREE.Mesh(new THREE.CircleGeometry(10, 32), new THREE.MeshPhongMaterial({ color: 0x1E90FF, shininess: 100 }));
            lake.rotation.x = -Math.PI / 2;
            lake.position.set(12, 0.06, -15);
            scene.add(lake);

            // Βουνά
            const mountainMat = new THREE.MeshPhongMaterial({ color: 0x687888 });
            for (let i = 0; i < 10; i++) {
                const m = new THREE.Mesh(new THREE.ConeGeometry(15, 22, 4), mountainMat);
                let angle = (i / 10) * Math.PI * 2;
                m.position.set(Math.cos(angle) * 90, 11, Math.sin(angle) * 90);
                scene.add(m);
            }

            // --- ΝΕΟΣ ΧΑΡΑΚΤΗΡΑΣ (Sci-Fi Drone / Crystal Orb αντί για ανθρωπάκι) ---
            player = new THREE.Group();
            const coreMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.6, 32, 32),
                new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x004466, shininess: 100, wireframe: false })
            );
            coreMesh.position.y = 1.0;
            player.add(coreMesh);

            const ringMesh = new THREE.Mesh(
                new THREE.TorusGeometry(0.9, 0.05, 16, 100),
                new THREE.MeshPhongMaterial({ color: 0xf39c12, emissive: 0x553300 })
            );
            ringMesh.rotation.x = Math.PI / 2;
            ringMesh.position.y = 1.0;
            player.add(ringMesh);
            scene.add(player);

            // Πλάσμα / Guardian
            guardian = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshPhongMaterial({ color: 0xFBBF24, emissive: 0x663300 }));
            scene.add(guardian);

            // Δέντρα
            function createTree(x, z) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.5), new THREE.MeshPhongMaterial({ color: 0x8B4513 }));
                trunk.position.y = 0.75;
                tree.add(trunk);
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.3, 2.8, 6), new THREE.MeshPhongMaterial({ color: 0x006400 }));
                leaves.position.y = 2.3;
                tree.add(leaves);
                tree.position.set(x, 0, z);
                scene.add(tree);
            }

            for (let i = 0; i < 40; i++) {
                let tx = (Math.random() - 0.5) * 120;
                let tz = (Math.random() - 0.5) * 120;
                if (Math.abs(tx) > 8 || Math.abs(tz) > 8) createTree(tx, tz);
            }

            // 360 Touch & Mouse Rotation Events
            window.addEventListener('pointerdown', e => {
                if(e.target.closest('#ui')) return;
                isDragging = true;
                previousTouchX = e.clientX;
            });
            window.addEventListener('pointermove', e => {
                if (!isDragging) return;
                let deltaX = e.clientX - previousTouchX;
                cameraAngle -= deltaX * 0.008;
                previousTouchX = e.clientX;
            });
            window.addEventListener('pointerup', () => { isDragging = false; });

            // Keyboard & Touch movement binding
            window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
            window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

            const bindTouch = (id, k) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
                el.addEventListener('mousedown', () => keys[k] = true);
                el.addEventListener('mouseup', () => keys[k] = false);
            };
            bindTouch('zoneW', 'w'); bindTouch('zoneS', 's'); bindTouch('zoneA', 'a'); bindTouch('zoneD', 'd');

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const speed = 0.15;
            
            // Κίνηση βάσει της κατεύθυνσης της κάμερας
            let forwardX = Math.sin(cameraAngle);
            let forwardZ = Math.cos(cameraAngle);
            let rightX = Math.sin(cameraAngle + Math.PI/2);
            let rightZ = Math.cos(cameraAngle + Math.PI/2);

            if (keys.w) { player.position.x -= forwardX * speed; player.position.z -= forwardZ * speed; }
            if (keys.s) { player.position.x += forwardX * speed; player.position.z += forwardZ * speed; }
            if (keys.a) { player.position.x -= rightX * speed; player.position.z -= rightZ * speed; }
            if (keys.d) { player.position.x += rightX * speed; player.position.z += rightZ * speed; }

            // Animation για το Drone/Orb
            player.children[1].rotation.z += 0.03;

            const time = Date.now() * 0.003;
            guardian.position.x = player.position.x + Math.sin(time) * 1.8;
            guardian.position.z = player.position.z + Math.cos(time) * 1.8;
            guardian.position.y = 1 + Math.sin(time * 2) * 0.2;

            // 360 Κάμερα γύρω από τον χαρακτήρα
            camera.position.x = player.position.x + Math.sin(cameraAngle) * cameraDistance;
            camera.position.z = player.position.z + Math.cos(cameraAngle) * cameraDistance;
            camera.position.y = player.position.y + cameraHeight;
            camera.lookAt(player.position.x, player.position.y + 0.8, player.position.z);

            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
